services:
  backend:
    container_name: proteinpro-api
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
        - '8780:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=ProteinPro;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
    networks:
      - shared-net
      - proxy-net

networks:
  shared-net:
    external: true
  proxy-net:
    external: true